<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Générer les icônes HSE</title></head>
<body style="font-family:sans-serif;padding:24px;background:#16191f;color:#fff">
<h2 style="color:#f5a623">Générateur d'icônes HSE PWA</h2>
<p>Cliquez sur chaque bouton pour télécharger l'icône PNG correspondante.</p>
<div style="display:flex;gap:20px;margin-top:20px;flex-wrap:wrap">
  <div>
    <canvas id="c192" width="192" height="192"></canvas><br>
    <button onclick="dl('c192','icon-192.png')" style="margin-top:8px;padding:8px 16px;background:#f5a623;border:none;border-radius:6px;cursor:pointer;font-weight:bold">
      ⬇ Télécharger icon-192.png
    </button>
  </div>
  <div>
    <canvas id="c512" width="512" height="512"></canvas><br>
    <button onclick="dl('c512','icon-512.png')" style="margin-top:8px;padding:8px 16px;background:#f5a623;border:none;border-radius:6px;cursor:pointer;font-weight:bold">
      ⬇ Télécharger icon-512.png
    </button>
  </div>
</div>
<script>
function drawIcon(canvasId, size) {
  const c   = document.getElementById(canvasId);
  const ctx = c.getContext('2d');
  const r   = size * 0.12; // border-radius

  // Fond noir arrondi
  ctx.beginPath();
  ctx.moveTo(r, 0); ctx.lineTo(size - r, 0);
  ctx.arcTo(size, 0, size, r, r);
  ctx.lineTo(size, size - r);
  ctx.arcTo(size, size, size - r, size, r);
  ctx.lineTo(r, size);
  ctx.arcTo(0, size, 0, size - r, r);
  ctx.lineTo(0, r);
  ctx.arcTo(0, 0, r, 0, r);
  ctx.closePath();
  ctx.fillStyle = '#0e1014';
  ctx.fill();
  ctx.save();
  ctx.clip();

  // Rayures diagonales amber/noir
  const stripe = size / 8;
  for (let i = -size; i < size * 2; i += stripe * 2) {
    ctx.beginPath();
    ctx.moveTo(i, 0); ctx.lineTo(i + stripe, 0);
    ctx.lineTo(i + stripe + size, size); ctx.lineTo(i + size, size);
    ctx.closePath();
    ctx.fillStyle = 'rgba(245,166,35,0.25)';
    ctx.fill();
  }

  // Cercle de fond central
  ctx.beginPath();
  ctx.arc(size/2, size/2, size * 0.38, 0, Math.PI*2);
  ctx.fillStyle = '#1a1d24';
  ctx.fill();
  ctx.strokeStyle = '#f5a623';
  ctx.lineWidth = size * 0.025;
  ctx.stroke();

  // Emoji 🦺 centré
  ctx.restore();
  ctx.font = `${size * 0.38}px serif`;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🦺', size / 2, size / 2 + size * 0.02);

  // Liseré amber en bas
  ctx.fillStyle = '#f5a623';
  ctx.fillRect(0, size - size * 0.06, size, size * 0.06);
}

drawIcon('c192', 192);
drawIcon('c512', 512);

function dl(canvasId, filename) {
  const c   = document.getElementById(canvasId);
  const a   = document.createElement('a');
  a.href     = c.toDataURL('image/png');
  a.download = filename;
  a.click();
}
</script>
</body>
</html>
